<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f5b941"/>
    </marker>
  </defs>
  <rect width="1600" height="800" fill="url(#bg)"/>

  <text x="80" y="96" font-size="44" font-weight="700" fill="#e8eef7">ExeLat pipeline</text>
  <text x="80" y="138" font-size="22" fill="#7f8fae" font-family="Consolas, monospace">Unpack → AI Translate → UI RTL Fix → Repack</text>

  <!-- Input -->
  <g>
    <rect x="80" y="330" width="180" height="140" rx="14" fill="#0b1120" stroke="#4fd8e0" stroke-width="3"/>
    <text x="170" y="388" text-anchor="middle" font-size="26" font-weight="700" fill="#4fd8e0" font-family="Consolas, monospace">app.exe</text>
    <text x="170" y="424" text-anchor="middle" font-size="19" fill="#9fb0cc">Russian / English</text>
    <text x="170" y="450" text-anchor="middle" font-size="17" fill="#7f8fae" font-family="Consolas, monospace">LTR</text>
  </g>

  <!-- Stages -->
  <g font-size="19" fill="#9fb0cc">
    <g>
      <rect x="320" y="270" width="240" height="260" rx="16" fill="#111a2e" stroke="#27365a" stroke-width="3"/>
      <text x="344" y="312" font-size="17" fill="#f5b941" font-family="Consolas, monospace">01</text>
      <text x="344" y="352" font-size="30" font-weight="700" fill="#e8eef7">Unpack</text>
      <text x="344" y="400">Parse PE headers</text>
      <text x="344" y="432">Walk .rsrc tree</text>
      <text x="344" y="464">Extract strings,</text>
      <text x="344" y="492">menus, dialogs</text>
    </g>
    <g>
      <rect x="620" y="270" width="240" height="260" rx="16" fill="#111a2e" stroke="#27365a" stroke-width="3"/>
      <text x="644" y="312" font-size="17" fill="#f5b941" font-family="Consolas, monospace">02</text>
      <text x="644" y="352" font-size="30" font-weight="700" fill="#e8eef7">AI Translate</text>
      <text x="644" y="400">Batch strings by ID</text>
      <text x="644" y="432">LLM → Hebrew</text>
      <text x="644" y="464">Keep placeholders</text>
      <text x="644" y="492">and accelerators</text>
    </g>
    <g>
      <rect x="920" y="270" width="240" height="260" rx="16" fill="#111a2e" stroke="#27365a" stroke-width="3"/>
      <text x="944" y="312" font-size="17" fill="#f5b941" font-family="Consolas, monospace">03</text>
      <text x="944" y="352" font-size="30" font-weight="700" fill="#e8eef7">UI RTL Fix</text>
      <text x="944" y="400">Mirror dialog layout</text>
      <text x="944" y="432">WS_EX_LAYOUTRTL</text>
      <text x="944" y="464">Hebrew-capable font</text>
      <text x="944" y="492">Resize on overflow</text>
    </g>
    <g>
      <rect x="1220" y="270" width="240" height="260" rx="16" fill="#111a2e" stroke="#27365a" stroke-width="3"/>
      <text x="1244" y="312" font-size="17" fill="#f5b941" font-family="Consolas, monospace">04</text>
      <text x="1244" y="352" font-size="30" font-weight="700" fill="#e8eef7">Repack</text>
      <text x="1244" y="400">Rebuild .rsrc</text>
      <text x="1244" y="432">Patch data directory</text>
      <text x="1244" y="464">Fix SizeOfImage,</text>
      <text x="1244" y="492">checksum</text>
    </g>
  </g>

  <!-- Arrows between stages -->
  <g stroke="#f5b941" stroke-width="4" marker-end="url(#arrow)">
    <line x1="262" y1="400" x2="314" y2="400"/>
    <line x1="562" y1="400" x2="614" y2="400"/>
    <line x1="862" y1="400" x2="914" y2="400"/>
    <line x1="1162" y1="400" x2="1214" y2="400"/>
  </g>

  <!-- Output: below Repack -->
  <g>
    <line x1="1340" y1="532" x2="1340" y2="594" stroke="#f5b941" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="1220" y="600" width="240" height="120" rx="14" fill="#0b1120" stroke="#f5b941" stroke-width="3"/>
    <text x="1340" y="650" text-anchor="middle" font-size="26" font-weight="700" fill="#f5b941" font-family="Consolas, monospace">app.he.exe</text>
    <text x="1340" y="686" text-anchor="middle" font-size="19" fill="#9fb0cc">Hebrew · RTL</text>
  </g>

  <!-- Fallback strategies -->
  <g>
    <rect x="320" y="600" width="840" height="120" rx="14" fill="none" stroke="#27365a" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="344" y="640" font-size="17" fill="#4fd8e0" font-family="Consolas, monospace">RUNTIME FALLBACKS — when text is not in resources</text>
    <text x="344" y="680" font-size="20" fill="#9fb0cc">Dynamic API hooking: intercept text-drawing calls and swap strings in memory</text>
    <text x="344" y="708" font-size="20" fill="#9fb0cc">OCR overlay: read rendered pixels and draw translated text on top</text>
  </g>
  <line x1="740" y1="532" x2="740" y2="596" stroke="#27365a" stroke-width="3" stroke-dasharray="8 8"/>
</svg>
