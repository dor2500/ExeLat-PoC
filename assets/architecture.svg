<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f5b941"/>
    </marker>
  </defs>
  <rect width="1600" height="800" fill="url(#bg)"/>

  <text x="80" y="96" font-size="44" font-weight="700" fill="#e8eef7">ExeLat pipeline</text>
  <text x="80" y="138" font-size="22" fill="#7f8fae" font-family="Consolas, monospace">Unpack → Translate → UI RTL Fix → Repack</text>

  <!-- Input -->
  <g>
    <rect x="60" y="320" width="210" height="160" rx="14" fill="#0b1120" stroke="#4fd8e0" stroke-width="3"/>
    <text x="165" y="372" text-anchor="middle" font-size="24" font-weight="700" fill="#4fd8e0" font-family="Consolas, monospace">Program folder</text>
    <text x="165" y="408" text-anchor="middle" font-size="18" fill="#9fb0cc" font-family="Consolas, monospace">.exe  .dll  .mui</text>
    <text x="165" y="440" text-anchor="middle" font-size="18" fill="#9fb0cc">English / Russian</text>
    <text x="165" y="464" text-anchor="middle" font-size="16" fill="#7f8fae" font-family="Consolas, monospace">LTR</text>
  </g>

  <!-- Stages -->
  <g font-size="19" fill="#9fb0cc">
    <g>
      <rect x="320" y="250" width="250" height="300" rx="16" fill="#111a2e" stroke="#27365a" stroke-width="3"/>
      <text x="344" y="292" font-size="17" fill="#f5b941" font-family="Consolas, monospace">01</text>
      <text x="344" y="332" font-size="30" font-weight="700" fill="#e8eef7">Unpack</text>
      <text x="344" y="380">Check every file</text>
      <text x="344" y="412">Menus, dialogs,</text>
      <text x="344" y="440">string tables</text>
      <text x="344" y="472">Delphi forms</text>
      <text x="344" y="504">Coverage report</text>
    </g>
    <g>
      <rect x="620" y="250" width="250" height="300" rx="16" fill="#111a2e" stroke="#27365a" stroke-width="3"/>
      <text x="644" y="292" font-size="17" fill="#f5b941" font-family="Consolas, monospace">02</text>
      <text x="644" y="332" font-size="30" font-weight="700" fill="#e8eef7">Translate</text>
      <text x="644" y="380">Offline glossary</text>
      <text x="644" y="412">Claude, in batches</text>
      <text x="644" y="444">Check placeholders</text>
      <text x="644" y="472">and shortcuts</text>
      <text x="644" y="504">Edit by hand</text>
    </g>
    <g>
      <rect x="920" y="250" width="250" height="300" rx="16" fill="#111a2e" stroke="#27365a" stroke-width="3"/>
      <text x="944" y="292" font-size="17" fill="#f5b941" font-family="Consolas, monospace">03</text>
      <text x="944" y="332" font-size="30" font-weight="700" fill="#e8eef7">UI RTL Fix</text>
      <text x="944" y="380">Mirror dialogs</text>
      <text x="944" y="408" font-size="16" fill="#7f8fae" font-family="Consolas, monospace">WS_EX_LAYOUTRTL</text>
      <text x="944" y="444">Mirror main windows</text>
      <text x="944" y="480">Delphi forms RTL</text>
      <text x="944" y="508" font-size="16" fill="#7f8fae" font-family="Consolas, monospace">BiDiMode</text>
    </g>
    <g>
      <rect x="1220" y="250" width="250" height="300" rx="16" fill="#111a2e" stroke="#27365a" stroke-width="3"/>
      <text x="1244" y="292" font-size="17" fill="#f5b941" font-family="Consolas, monospace">04</text>
      <text x="1244" y="332" font-size="30" font-weight="700" fill="#e8eef7">Repack</text>
      <text x="1244" y="380">Copy the folder</text>
      <text x="1244" y="412">Rewrite resources</text>
      <text x="1244" y="440" font-size="16" fill="#7f8fae" font-family="Consolas, monospace">UpdateResource API</text>
      <text x="1244" y="476">Drop old signature</text>
      <text x="1244" y="508">Fix checksum</text>
    </g>
  </g>

  <!-- Arrows between stages -->
  <g stroke="#f5b941" stroke-width="4" marker-end="url(#arrow)">
    <line x1="272" y1="400" x2="314" y2="400"/>
    <line x1="572" y1="400" x2="614" y2="400"/>
    <line x1="872" y1="400" x2="914" y2="400"/>
    <line x1="1172" y1="400" x2="1214" y2="400"/>
  </g>

  <!-- Output: below Repack -->
  <g>
    <line x1="1345" y1="552" x2="1345" y2="614" stroke="#f5b941" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="1220" y="620" width="250" height="120" rx="14" fill="#0b1120" stroke="#f5b941" stroke-width="3"/>
    <text x="1345" y="668" text-anchor="middle" font-size="24" font-weight="700" fill="#f5b941" font-family="Consolas, monospace">Program-he</text>
    <text x="1345" y="706" text-anchor="middle" font-size="19" fill="#9fb0cc">Hebrew · RTL · full copy</text>
  </g>

  <!-- Not implemented -->
  <g>
    <rect x="320" y="620" width="850" height="120" rx="14" fill="none" stroke="#27365a" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="344" y="660" font-size="17" fill="#7f8fae" font-family="Consolas, monospace">DESIGN ONLY, NOT BUILT — for text that is not in resources</text>
    <text x="344" y="698" font-size="19" fill="#7f8fae">Dynamic API hooking: swap strings in memory as the program draws them</text>
    <text x="344" y="726" font-size="19" fill="#7f8fae">OCR overlay: read rendered pixels and draw translated text on top</text>
  </g>
</svg>
